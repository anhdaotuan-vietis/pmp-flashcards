<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMP Vocab Quiz</title>
<style>
:root{--bg:#0f141c;--card:#171f2b;--card2:#1d2735;--text:#e7edf6;--muted:#93a1b8;--border:#26303f;
 --primary:#5b8dff;--soft:#1b2740;--ok:#5fd996;--okbg:#12321f;--okbd:#2f6b45;--warn:#ffb85f;--warnbg:#3a2a12;--warnbd:#7a5a20;--wrong:#ff8080;--wrongbg:#3a1414;--wrongbd:#7a2f2f;}
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--card2:#f0f3fa;--text:#1a2233;--muted:#5a6784;--border:#e2e7f0;
 --primary:#2563eb;--soft:#eaf1ff;--ok:#15803d;--okbg:#e7f7ec;--okbd:#8fd6a6;--warn:#b06a12;--warnbg:#fdf2e2;--warnbd:#e6c68a;--wrong:#c02626;--wrongbg:#fdeaea;--wrongbd:#e6a0a0;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:12px}
.tbtn{font-family:inherit;font-size:14px;font-weight:600;padding:7px 11px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.tabs{display:flex;gap:8px;margin:6px 0 14px}
.tab{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.tab.active{background:var(--soft);color:var(--primary);border-color:var(--primary)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
select,.seg button{font-family:inherit;font-size:13px}
select{background:var(--card2);color:var(--text);border:1.5px solid var(--border);border-radius:9px;padding:7px 9px}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{padding:7px 11px;border:0;background:var(--card2);color:var(--muted);cursor:pointer;font-weight:600}
.seg button.on{background:var(--primary);color:#fff}
.big{width:100%;font-family:inherit;font-size:16px;font-weight:800;padding:13px;border-radius:12px;border:0;background:var(--primary);color:#fff;cursor:pointer;margin-top:4px}
.big.sec{background:var(--card2);color:var(--text);border:1.5px solid var(--border)}
.prog{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin:2px 0 14px}
.prog>i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.qword{font-size:26px;font-weight:800;text-align:center;margin:10px 0 6px;word-break:break-word}
.qdir{text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font-family:inherit;font-size:15.5px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.correct{background:var(--okbg);border-color:var(--okbd);color:var(--ok)}
.opt.correct .k{background:var(--okbd);color:#fff}
.opt.wrong{background:var(--wrongbg);border-color:var(--wrongbd);color:var(--wrong)}
.opt.wrong .k{background:var(--wrongbd);color:#fff}
.fb{margin-top:14px;font-size:14px;font-weight:600;text-align:center;min-height:20px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--wrong)}
.summary{text-align:center;padding:8px 0}
.score{font-size:44px;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.witem{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.witem .en{font-weight:700}.witem .vi{color:var(--muted);font-size:13px}
.witem .x{margin-left:auto;flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--primary);margin-left:6px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
</style></head><body>
<div class="wrap">
 <header>
   <div><h1>🎯 PMP Vocab Quiz</h1><div class="sub">Trắc nghiệm 378 từ vựng PMP</div></div>
   <button class="tbtn" id="theme">☀️</button>
 </header>
 <div class="tabs">
   <button class="tab active" data-tab="quiz">📝 Làm đề</button>
   <button class="tab" data-tab="wrong">❌ Từ sai <span class="pill" id="wcount">0</span></button>
 </div>

 <!-- QUIZ TAB -->
 <div id="tab-quiz">
   <!-- setup -->
   <div class="card" id="setup">
     <div class="row" style="margin-bottom:12px"><span class="lbl">Số câu</span>
       <div class="seg" id="segN">
         <button data-n="10" class="on">10</button><button data-n="20">20</button><button data-n="30">30</button><button data-n="0">Tất cả</button>
       </div>
     </div>
     <div class="row" style="margin-bottom:12px"><span class="lbl">Hỏi</span>
       <div class="seg" id="segDir">
         <button data-d="en2vi" class="on">Anh → Việt</button><button data-d="vi2en">Việt → Anh</button><button data-d="mix">Trộn</button>
       </div>
     </div>
     <button class="big" id="start">Bắt đầu</button>
   </div>
   <!-- running -->
   <div id="run" class="hidden">
     <div class="prog"><i id="bar"></i></div>
     <div class="card">
       <div class="qmeta"><span id="qidx"></span><span id="qscore"></span></div>
       <div class="qword" id="qword"></div>
       <div class="qdir" id="qdirlbl"></div>
       <div class="opts" id="opts"></div>
       <div class="fb" id="fb"></div>
       <button class="big hidden" id="next">Câu tiếp →</button>
     </div>
     <button class="big sec" id="quit">Dừng</button>
   </div>
   <!-- result -->
   <div id="result" class="hidden">
     <div class="card summary">
       <div class="score" id="rscore"></div>
       <div class="sub" id="rline"></div>
       <div class="statgrid">
         <div class="stat"><b id="rc" style="color:var(--ok)">0</b><span>Đúng</span></div>
         <div class="stat"><b id="rw" style="color:var(--wrong)">0</b><span>Sai</span></div>
         <div class="stat"><b id="rt">0</b><span>Tổng</span></div>
       </div>
     </div>
     <button class="big" id="again">Làm đề mới</button>
     <button class="big sec hidden" id="doWrong" style="margin-top:8px">Ôn lại từ sai vừa rồi</button>
   </div>
 </div>

 <!-- WRONG TAB -->
 <div id="tab-wrong" class="hidden">
   <div class="card">
     <div class="row" style="justify-content:space-between">
       <div><b id="wtitle">Từ đã trả lời sai</b><div class="sub" id="wsub"></div></div>
     </div>
     <div class="row" style="margin-top:12px">
       <button class="big" id="reviewWrong" style="flex:1;margin-top:0">🔁 Ôn lại tất cả từ sai</button>
     </div>
     <div class="row" style="margin-top:8px">
       <button class="tbtn" id="clearWrong">🗑 Xoá hết</button>
     </div>
   </div>
   <div class="wlist" id="wlist"></div>
 </div>

 <footer>Trả lời đúng 1 từ → gỡ khỏi danh sách sai · Tiến độ lưu trên máy bạn</footer>
</div>

ility", "vi": "trách nhiệm"}, {"en": "and prone to errors", "vi": "dễ xảy ra lỗi"}, {"en": "involving", "vi": "liên quan"}, {"en": "outpacing", "vi": "vượt xa"}, {"en": "prefer", "vi": "thích hơn"}, {"en": "Examine", "vi": "nghiên cứu xem xét"}, {"en": "cooperation", "vi": "hợp tác"}, {"en": "restrictions", "vi": "hạn chế"}, {"en": "mistakenly", "vi": "nhầm lẫn"}, {"en": "recurring", "vi": "định kì"}, {"en": "struggled to", "vi": "gặp khó khắn trong việc"}, {"en": "executing", "vi": "thực hiện"}, {"en": "instability", "vi": "bất ổn"}, {"en": "amendments", "vi": "sửa đổi"}, {"en": "retaining", "vi": "lưu giữ"}, {"en": "negatively", "vi": "tiêu cực"}, {"en": "layoffs", "vi": "sa thải"}, {"en": "equalize", "vi": "cân bằng"}, {"en": "equipment", "vi": "thiết bị"}, {"en": "diagnostic", "vi": "chuẩn đoán"}, {"en": "inspections", "vi": "kiểm tra"}, {"en": "bound by", "vi": "bị giàng buộc"}, {"en": "undermining", "vi": "làm suy yếu"}];
const LS_WRONG='pmpvq_wrong', LS_THEME='pmpvq_theme';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* theme */
(function(){let t;try{t=localStorage.getItem(LS_THEME)}catch(e){}t=t||'dark';document.documentElement.setAttribute('data-theme',t);})();
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(LS_THEME,t)}catch(e){}$('#theme').textContent=t==='dark'?'☀️':'🌙';}
setTheme(document.documentElement.getAttribute('data-theme'));
$('#theme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* wrong store (by en key) */
function loadWrong(){try{return JSON.parse(localStorage.getItem(LS_WRONG)||'[]')}catch(e){return[]}}
function saveWrong(a){try{localStorage.setItem(LS_WRONG,JSON.stringify(a))}catch(e){}}
let wrong=loadWrong();
function addWrong(en){if(!wrong.includes(en)){wrong.push(en);saveWrong(wrong);}refreshWrong();}
function removeWrong(en){wrong=wrong.filter(x=>x!==en);saveWrong(wrong);refreshWrong();}
function wordByEn(en){return BASE.find(w=>w.en===en);}
function refreshWrong(){$('#wcount').textContent=wrong.length;renderWrongTab();}

/* utils */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* settings */
let nSel=10,dirSel='en2vi';
$('#segN').onclick=e=>{if(e.target.dataset.n===undefined)return;$$('#segN button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');nSel=+e.target.dataset.n;};
$('#segDir').onclick=e=>{if(e.target.dataset.d===undefined)return;$$('#segDir button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');dirSel=e.target.dataset.d;};

/* tabs */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  const k=t.dataset.tab;
  $('#tab-quiz').classList.toggle('hidden',k!=='quiz');
  $('#tab-wrong').classList.toggle('hidden',k!=='wrong');
});

/* quiz state */
let queue=[],pos=0,correct=0,roundWrong=[],reviewMode=false;

function buildRound(pool,dir){
  let words=shuffle(pool);
  if(nSel>0 && !reviewMode) words=words.slice(0,nSel);
  return words.map(w=>{
    const d = dir==='mix' ? (Math.random()<.5?'en2vi':'vi2en') : dir;
    const qKey = d==='en2vi' ? 'en':'vi';
    const aKey = d==='en2vi' ? 'vi':'en';
    // distractors from whole BASE, distinct answer text
    const poutPool=shuffle(BASE.filter(x=>x[aKey]!==w[aKey]));
    const distract=[]; const seen=new Set([w[aKey]]);
    for(const x of poutPool){if(!seen.has(x[aKey])){seen.add(x[aKey]);distract.push(x[aKey]);}if(distract.length===3)break;}
    const options=shuffle([w[aKey],...distract]);
    return {en:w.en, q:w[qKey], a:w[aKey], options, dir:d};
  });
}

function startRound(pool,dir){
  reviewMode = pool!==BASE ? reviewMode : false;
  queue=buildRound(pool,dir);pos=0;correct=0;roundWrong=[];
  $('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#run').classList.remove('hidden');
  // ensure quiz tab visible
  $$('.tab').forEach(x=>x.classList.remove('active'));$$('.tab')[0].classList.add('active');
  $('#tab-quiz').classList.remove('hidden');$('#tab-wrong').classList.add('hidden');
  renderQ();
}

function renderQ(){
  const it=queue[pos];
  $('#bar').style.width=(pos/queue.length*100)+'%';
  $('#qidx').textContent=`Câu ${pos+1}/${queue.length}`;
  $('#qscore').textContent=`✅ ${correct}`;
  $('#qword').textContent=it.q;
  $('#qdirlbl').textContent=it.dir==='en2vi'?'Nghĩa tiếng Việt là?':'Từ tiếng Anh là?';
  $('#fb').textContent='';$('#fb').className='fb';
  $('#next').classList.add('hidden');
  const box=$('#opts');box.innerHTML='';
  it.options.forEach((opt,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span>${opt}</span>`;
    b.onclick=()=>pick(b,opt,it);
    box.appendChild(b);
  });
}

function pick(btn,opt,it){
  $$('#opts .opt').forEach(b=>b.disabled=true);
  const ok = opt===it.a;
  if(ok){
    btn.classList.add('correct');correct++;
    $('#fb').textContent='Chính xác 🎉';$('#fb').className='fb ok';
    removeWrong(it.en); // mastered
  }else{
    btn.classList.add('wrong');
    $$('#opts .opt').forEach(b=>{if(b.querySelector('span:last-child').textContent===it.a)b.classList.add('correct');});
    $('#fb').innerHTML=`Sai. Đáp án đúng: <b>${it.a}</b>`;$('#fb').className='fb no';
    addWrong(it.en);roundWrong.push(it.en);
  }
  $('#qscore').textContent=`✅ ${correct}`;
  $('#next').classList.remove('hidden');
  $('#next').textContent = pos+1>=queue.length ? 'Xem kết quả →' : 'Câu tiếp →';
  $('#next').focus();
}

$('#next').onclick=()=>{pos++;if(pos>=queue.length)finish();else renderQ();};
$('#quit').onclick=()=>{$('#run').classList.add('hidden');$('#setup').classList.remove('hidden');reviewMode=false;};

function finish(){
  $('#bar').style.width='100%';
  $('#run').classList.add('hidden');$('#result').classList.remove('hidden');
  const t=queue.length,w=t-correct,pct=t?Math.round(correct/t*100):0;
  $('#rscore').textContent=pct+'%';
  $('#rscore').style.color = pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--wrong)';
  $('#rline').textContent = reviewMode? 'Ôn lại từ sai xong!' : (pct>=80?'Tốt lắm! 💪':pct>=60?'Gần được rồi 👍':'Cần ôn thêm 📚');
  $('#rc').textContent=correct;$('#rw').textContent=w;$('#rt').textContent=t;
  $('#doWrong').classList.toggle('hidden', roundWrong.length===0);
  reviewMode=false;
}

$('#start').onclick=()=>startRound(BASE,dirSel);
$('#again').onclick=()=>{$('#result').classList.add('hidden');$('#setup').classList.remove('hidden');};
$('#doWrong').onclick=()=>{const pool=roundWrong.map(wordByEn).filter(Boolean);if(!pool.length)return;reviewMode=true;startRound(pool,dirSel);};

/* wrong tab */
$('#reviewWrong').onclick=()=>{const pool=wrong.map(wordByEn).filter(Boolean);if(!pool.length){alert('Chưa có từ sai nào 🎉');return;}reviewMode=true;startRound(pool,dirSel);};
$('#clearWrong').onclick=()=>{if(!wrong.length)return;if(confirm('Xoá toàn bộ danh sách từ sai?')){wrong=[];saveWrong(wrong);refreshWrong();}};
function renderWrongTab(){
  $('#wsub').textContent=wrong.length?`${wrong.length} từ cần ôn lại`:'';
  const box=$('#wlist');box.innerHTML='';
  if(!wrong.length){box.innerHTML='<div class="empty">Chưa có từ sai nào.<br>Làm đề ở tab 📝 — trả lời sai từ nào sẽ xuất hiện ở đây.</div>';$('#reviewWrong').disabled=true;$('#reviewWrong').style.opacity=.5;return;}
  $('#reviewWrong').disabled=false;$('#reviewWrong').style.opacity=1;
  wrong.slice().reverse().forEach(en=>{
    const w=wordByEn(en);if(!w)return;
    const d=document.createElement('div');d.className='witem';
    d.innerHTML=`<div><div class="en">${w.en}</div><div class="vi">${w.vi}</div></div><button class="x" title="Đã thuộc">✕</button>`;
    d.querySelector('.x').onclick=()=>removeWrong(en);
    box.appendChild(d);
  });
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if($('#run').classList.contains('hidden'))return;
  if(!$('#next').classList.contains('hidden')){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#next').click();}return;}
  const i='1234'.indexOf(e.key);if(i>=0){const b=$$('#opts .opt')[i];if(b&&!b.disabled)b.click();}
});

refreshWrong();
</script>
